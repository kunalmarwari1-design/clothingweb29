<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - MenStyle</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">MenStyle</div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="product.html">Shop</a></li>
                <li><a href="cart.html" class="cart-link">
                    <span>🛒</span>
                    <span id="cart-count" class="cart-count">0</span>
                </a></li>
            </ul>
        </div>
    </nav>

    <!-- Checkout Section -->
    <section class="checkout-section">
        <div class="container">
            <h1>Checkout</h1>

            <div class="checkout-container">
                <div class="checkout-form">
                    <h2>Billing Information</h2>
                    <form id="checkout-form">
                        <div class="form-row">
                            <div class="form-group">
                                <label>First Name *</label>
                                <input type="text" required>
                            </div>
                            <div class="form-group">
                                <label>Last Name *</label>
                                <input type="text" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label>Email Address *</label>
                            <input type="email" required>
                        </div>

                        <div class="form-group">
                            <label>Phone Number *</label>
                            <input type="tel" required>
                        </div>

                        <div class="form-group">
                            <label>Street Address *</label>
                            <input type="text" required>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label>City *</label>
                                <input type="text" required>
                            </div>
                            <div class="form-group">
                                <label>State/Province *</label>
                                <input type="text" required>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label>Postal Code *</label>
                                <input type="text" required>
                            </div>
                            <div class="form-group">
                                <label>Country *</label>
                                <input type="text" required>
                            </div>
                        </div>

                        <h2>Payment Information</h2>

                        <div class="form-group">
                            <label>Cardholder Name *</label>
                            <input type="text" required>
                        </div>

                        <div class="form-group">
                            <label>Card Number *</label>
                            <input type="text" placeholder="1234 5678 9012 3456" required>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label>Expiry Date *</label>
                                <input type="text" placeholder="MM/YY" required>
                            </div>
                            <div class="form-group">
                                <label>CVV *</label>
                                <input type="text" placeholder="123" required>
                            </div>
                        </div>

                        <label class="checkbox">
                            <input type="checkbox" required>
                            I agree to the terms and conditions
                        </label>

                        <button type="submit" class="btn btn-primary btn-block">Complete Purchase</button>
                    </form>
                </div>

                <div class="checkout-summary">
                    <h2>Order Summary</h2>
                    <div id="checkout-items"></div>
                    <div class="summary-row">
                        <span>Subtotal:</span>
                        <span id="checkout-subtotal">$0.00</span>
                    </div>
                    <div class="summary-row">
                        <span>Shipping:</span>
                        <span id="checkout-shipping">$10.00</span>
                    </div>
                    <div class="summary-row">
                        <span>Tax:</span>
                        <span id="checkout-tax">$0.00</span>
                    </div>
                    <div class="summary-row total">
                        <span>Total:</span>
                        <span id="checkout-total">$0.00</span>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-section">
                    <h4>About Us</h4>
                    <p>MenStyle - Premium Men's Clothing</p>
                </div>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
